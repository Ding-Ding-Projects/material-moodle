name: Material Pages

# Publishes the Material Moodle website (material/site) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'material/site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check links and structure
        run: node material/site/scripts/check-links.mjs

      - name: Prepare the site folder
        # Build scripts and README screenshots stay in the repository but are not published.
        run: |
          mkdir -p _site
          rsync -a --exclude scripts --exclude screenshots material/site/ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
