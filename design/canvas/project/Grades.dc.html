<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grades, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
@keyframes mm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mm-in{animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both}
.mm-still .mm-in{animation:none}
.mm-still *{transition:none!important;animation:none!important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--fx);outline-offset:2px}
.mm-field:focus-within{box-shadow:inset 0 -2px 0 var(--fx)}
.mm-row{transition:background-color .2s ease}
.mm-row:hover{background:var(--hv)}
.mm-ring{transition:stroke-dashoffset .5s cubic-bezier(.05,.7,.1,1)}
</style>
</helmet>
<div class="{{rootClass}}" style="--fx:{{c.p}};--hv:{{c.high}};width:1440px;height:900px;position:relative;overflow:hidden;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:16px;line-height:1.55;background:{{c.bg}};color:{{c.on}}">

  <nav aria-label="Main navigation" style="width:96px;height:900px;flex:none;background:{{c.low}};display:flex;flex-direction:column;align-items:center;padding:20px 0 16px">
    <a href="#" aria-label="Riverside College home" style="width:48px;height:48px;border-radius:14px;background:{{c.p}};color:{{c.onp}};display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"></path></svg>
    </a>
    <button type="button" aria-label="New" style="margin-top:20px;width:56px;height:56px;border:0;border-radius:16px;background:{{c.pc}};color:{{c.onpc}};display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="#" aria-current="{{n.cur}}" style="width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{c.on}}">
          <span style="width:56px;height:32px;border-radius:16px;background:{{n.bg}};color:{{n.fg}};display:flex;align-items:center;justify-content:center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
          </span>
          <span style="font-size:12px;line-height:16px;font-weight:{{n.w}}">{{n.label}}</span>
        </a>
      </sc-for>
    </div>
    <div style="flex:1"></div>
    <button type="button" aria-label="Settings" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
    <button type="button" aria-label="Account: Mei Chan" style="margin-top:8px;width:40px;height:40px;border:0;border-radius:20px;background:{{c.tc}};color:{{c.ontc}};font-size:14px;font-weight:700;outline:{{ring}};outline-offset:2px;display:flex;align-items:center;justify-content:center">MC</button>
  </nav>

  <div style="flex:1;min-width:0;height:900px;display:flex;flex-direction:column">
    <header style="height:72px;flex:none;display:flex;align-items:center;gap:16px;padding:0 32px">
      <div style="flex:1;font-size:20px;line-height:1.3;font-weight:650">Grades</div>
      <label class="mm-field" style="position:relative;width:560px;height:56px;border-radius:28px;background:{{c.high}};display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 8px 28px rgba(27,27,33,.14)">
        <span style="width:24px;height:24px;flex:none;color:{{c.onv}};display:flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4"></path></svg></span>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search courses, people and settings</span>
        <input type="text" placeholder="Search courses, people and settings" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:{{c.on}};outline:none">
        <span style="flex:none;height:28px;padding:0 10px;border-radius:8px;background:{{c.highest}};color:{{c.onv}};font-family:'Roboto Mono',monospace;font-size:12px;display:flex;align-items:center">Ctrl K</span>
      </label>
      <div style="flex:1;display:flex;justify-content:flex-end;gap:8px">
        <button type="button" aria-label="Display settings" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"></path></svg></button>
        <button type="button" aria-label="Notifications, 1 new" style="position:relative;width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4"></path></svg><span style="position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:{{c.err}}"></span></button>
        <button type="button" aria-label="Help" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"></path></svg></button>
      </div>
    </header>

    <main style="flex:1;min-height:0;padding:0 32px 32px">
      <div style="max-width:1180px;height:100%;display:flex;flex-direction:column;gap:16px">
        <div style="flex:none">
          <h2 style="margin:0;font-weight:750;font-stretch:112%;font-size:32px;line-height:1.1">Grades</h2>
          <p style="margin:4px 0 0;font-size:14px;color:{{c.onv}}">Riverside College, autumn term. Select a course to see its graded items.</p>
        </div>

        <div role="group" aria-label="Courses" style="flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
          <sc-for list="{{courses}}" as="co" hint-placeholder-count="4">
            <button type="button" class="mm-in" aria-pressed="{{co.pressed}}" onClick="{{co.pick}}" style="animation-delay:{{co.delay}};min-width:0;height:128px;border:0;border-radius:28px;background:{{co.bg}};color:{{co.fg}};padding:16px 20px;text-align:left;display:flex;align-items:center;gap:16px">
              <span style="position:relative;width:80px;height:80px;flex:none">
                <svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
                  <circle cx="40" cy="40" r="34" fill="none" stroke="{{co.track}}" stroke-width="6"></circle>
                  <circle class="mm-ring" cx="40" cy="40" r="34" fill="none" stroke="{{co.arc}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="213.63" stroke-dashoffset="{{co.off}}" transform="rotate(-90 40 40)"></circle>
                </svg>
                <span style="position:absolute;left:0;top:0;width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:750;font-stretch:112%">{{co.letter}}</span>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                <span style="font-size:15px;font-weight:650;line-height:1.25">{{co.name}}</span>
                <span style="font-family:'Roboto Mono',monospace;font-size:12px;opacity:.85">{{co.code}}</span>
                <span style="font-size:20px;font-weight:650;line-height:1.3">{{co.pctText}}</span>
              </span>
            </button>
          </sc-for>
        </div>

        <section aria-label="Graded items" style="flex:1;min-height:0;border-radius:28px;background:{{c.low}};padding:16px 16px 8px;display:flex;flex-direction:column;gap:8px">
          <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:40px">
            <h3 style="margin:0;font-size:20px;line-height:1.3;font-weight:650">{{sel.name}}</h3>
            <span style="height:32px;padding:0 14px;border-radius:10px;background:{{c.pc}};color:{{c.onpc}};font-size:14px;font-weight:600;display:flex;align-items:center">Course total <span style="font-family:'Roboto Mono',monospace;margin-left:8px">{{sel.pctText}}</span></span>
          </div>
          <div style="flex:none;display:grid;grid-template-columns:minmax(0,2.4fr) 80px 110px 100px minmax(0,2.6fr);gap:16px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{c.onv}}">
            <span>Item</span><span>Weight</span><span>Grade</span><span>Range</span><span>Feedback</span>
          </div>
          <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
              <div class="mm-row mm-in" style="animation-delay:{{r.delay}};min-height:72px;flex:none;display:grid;grid-template-columns:minmax(0,2.4fr) 80px 110px 100px minmax(0,2.6fr);gap:16px;align-items:center;padding:0 16px;border-radius:20px">
                <span style="display:flex;align-items:center;gap:12px;min-width:0">
                  <span style="width:40px;height:40px;flex:none;border-radius:12px;background:{{r.tileBg}};color:{{r.tileFg}};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
                  <span style="min-width:0;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600;line-height:1.3">{{r.name}}</span><span style="font-size:13px;color:{{c.onv}}">{{r.type}}</span></span>
                </span>
                <span style="font-family:'Roboto Mono',monospace;font-size:14px;color:{{c.onv}}">{{r.weight}}</span>
                <span><span style="display:inline-block;height:24px;padding:0 8px;border-radius:8px;background:{{r.gBg}};color:{{r.gFg}};font-family:'Roboto Mono',monospace;font-size:13px;line-height:24px">{{r.grade}}</span></span>
                <span style="font-family:'Roboto Mono',monospace;font-size:14px;color:{{c.onv}}">{{r.range}}</span>
                <span style="font-size:14px;line-height:1.4;color:{{c.onv}}">{{r.feedback}}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'BIO101' }; }
  palette(dark, accent) {
    const L = { bg:'#FBF8FF', low:'#F5F2FB', cont:'#EFEDF6', high:'#E9E7F0', highest:'#E3E1EA', on:'#1B1B21', onv:'#45464F', outline:'#767680', ov:'#C6C5D0', p:accent, onp:'#FFFFFF', pc:'#DDE1FF', onpc:'#001454', sc:'#DEE1F9', onsc:'#171B2C', tc:'#FFD9E3', ontc:'#3E0021', okc:'#B7F1CF', onokc:'#002111', wc:'#FFE08A', onwc:'#241A00', err:'#BA1A1A' };
    const D = { bg:'#131318', low:'#1B1B21', cont:'#1F1F25', high:'#2A292F', highest:'#34343A', on:'#E4E1E9', onv:'#C6C5D0', outline:'#90909A', ov:'#45464F', p:'#B8C3FF', onp:'#002388', pc:'#2440BF', onpc:'#DDE1FF', sc:'#42455A', onsc:'#DEE1F9', tc:'#842653', ontc:'#FFD9E3', okc:'#005234', onokc:'#B7F1CF', wc:'#5B4300', onwc:'#FFE08A', err:'#FFB4AB' };
    return dark ? D : L;
  }
  data() {
    return [
      { code:'BIO101', name:'Introduction to Biology', pct:88.2, letter:'A-', items:[
        ['Cell structure lab report','Assignment','15%','46 / 50','0 to 50','Clear method. Tighten the discussion of controls.'],
        ['Quiz 1: cell biology','Quiz','10%','9 / 10','0 to 10','Well done.'],
        ['Quiz 2: genetics','Quiz','10%','8 / 10','0 to 10','Review dominant and recessive crosses.'],
        ['Lab practical','Assignment','20%','41 / 50','0 to 50','Good technique. Label diagrams fully.'],
        ['Lab forum posts','Forum','5%','5 / 5','0 to 5','Thoughtful replies to classmates.'],
        ['Final exam','Exam','40%','Not graded','0 to 100','Opens on 12 December.'] ] },
      { code:'HIS120', name:'World History', pct:81.0, letter:'B-', items:[
        ['Source analysis 1','Assignment','15%','38 / 50','0 to 50','Solid sources. Link each one to your argument.'],
        ['Quiz 1: ancient empires','Quiz','10%','7 / 10','0 to 10','Check the timeline of the Han dynasty.'],
        ['Seminar discussion','Forum','10%','9 / 10','0 to 10','Strong contributions.'],
        ['Essay draft: the Silk Road','Assignment','25%','Not graded','0 to 100','Due Thu 26 Nov, 23:59.'],
        ['Final exam','Exam','40%','Not graded','0 to 100','Opens on 14 December.'] ] },
      { code:'ENG210', name:'Creative Writing', pct:93.5, letter:'A', items:[
        ['Flash fiction','Assignment','15%','47 / 50','0 to 50','Vivid images and a confident ending.'],
        ['Workshop reflection','Assignment','10%','19 / 20','0 to 20','Insightful and well organised.'],
        ['Peer review 1','Forum','10%','10 / 10','0 to 10','Specific, kind and useful feedback.'],
        ['Short story','Assignment','35%','88 / 100','0 to 100','Strong voice. Trim the middle section.'],
        ['Portfolio','Assignment','30%','Not graded','0 to 100','Due Fri 11 December.'] ] },
      { code:'STA230', name:'Statistics with Python', pct:72.4, letter:'C', items:[
        ['Notebook 1: summaries','Assignment','10%','17 / 20','0 to 20','Good plots. Explain your choice of bins.'],
        ['Quiz 1: descriptive stats','Quiz','10%','6 / 10','0 to 10','Revisit the median and quartiles.'],
        ['Quiz 2: sampling','Quiz','10%','7 / 10','0 to 10','Improving. Watch sampling bias.'],
        ['Quiz 3: probability','Quiz','10%','Not graded','0 to 10','Fri 27 Nov, 10:00.'],
        ['Project proposal','Assignment','20%','Not graded','0 to 100','Due 4 December.'],
        ['Final exam','Exam','40%','Not graded','0 to 100','Opens on 15 December.'] ] }
    ];
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#3D5BD9';
    const motion = this.props.motion ?? true;
    const c = this.palette(dark, accent);
    const s = this.state;
    const nav = [
      ['Home','M4 11l8-7 8 7v9h-5v-6H9v6H4z'],
      ['Courses','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5'],
      ['Calendar','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
      ['Grades','M4 20V10M10 20V4M16 20v-8M22 20H2'],
      ['Messages','M4 5h16v11H8l-4 4z'],
      ['Everything','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z']
    ].map(([label, d]) => { const on = label === 'Grades'; return { label, d, cur: on ? 'page' : 'false', bg: on ? c.sc : 'transparent', fg: on ? c.onsc : c.onv, w: on ? 700 : 500 }; });
    const icons = { Assignment:'M5 3h10l4 4v14H5zM9 11h6M9 15h6', Quiz:'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01', Forum:'M4 5h16v11H8l-4 4z', Exam:'M9 4h6v3H9zM6 5h12v16H6zM9 12h6M9 16h4' };
    const tiles = { Assignment:[c.pc,c.onpc], Quiz:[c.wc,c.onwc], Forum:[c.okc,c.onokc], Exam:[c.tc,c.ontc] };
    const data = this.data();
    const courses = data.map((d, i) => {
      const on = s.sel === d.code;
      return {
        name: d.name, code: d.code, letter: d.letter, pctText: d.pct.toFixed(1) + '%',
        off: (213.63 * (1 - d.pct / 100)).toFixed(2),
        pressed: on ? 'true' : 'false', bg: on ? c.pc : c.low, fg: on ? c.onpc : c.on,
        track: on ? c.bg : c.highest, arc: on ? c.p : c.p, delay: (i * 60) + 'ms',
        pick: () => this.setState({ sel: d.code })
      };
    });
    const cur = data.filter((d) => d.code === s.sel)[0];
    const rows = cur.items.map(([name, type, weight, grade, range, feedback], i) => {
      let gBg = c.highest, gFg = c.onv;
      if (grade.indexOf('/') > -1) {
        const parts = grade.split(' / ');
        const p = (+parts[0]) / (+parts[1]);
        if (p >= 0.85) { gBg = c.okc; gFg = c.onokc; } else if (p >= 0.7) { gBg = c.pc; gFg = c.onpc; } else { gBg = c.wc; gFg = c.onwc; }
      }
      return { name, type, weight, grade, range, feedback, d: icons[type], tileBg: tiles[type][0], tileFg: tiles[type][1], gBg, gFg, delay: (i * 40) + 'ms' };
    });
    return { c, rootClass: motion ? '' : 'mm-still', ring: 'none', nav, courses, rows, sel: { name: cur.name, pctText: cur.pct.toFixed(1) + '% ' + cur.letter } };
  }
}
</script>
</body>
</html>
