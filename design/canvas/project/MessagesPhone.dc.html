<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messages, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
@keyframes mm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mm-sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mm-in{animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both}
.mm-sheet{animation:mm-sheet 320ms cubic-bezier(.05,.7,.1,1) both}
.mm-still .mm-in,.mm-still .mm-sheet{animation:none}
.mm-still *{transition:none!important;animation:none!important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--fx);outline-offset:2px}
.mm-field:focus-within{box-shadow:inset 0 -2px 0 var(--fx)}
</style>
</helmet>
<div class="{{rootClass}}" style="--fx:{{c.p}};width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:'Roboto Flex',system-ui,sans-serif;font-size:16px;line-height:1.55;background:{{c.bg}};color:{{c.on}}">

  <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
    <header style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px">
      <h1 style="flex:1;margin:0;font-weight:750;font-stretch:112%;font-size:26px;line-height:1.1">Messages</h1>
      <button type="button" aria-label="More actions" aria-expanded="{{sheetStr}}" onClick="{{openSheet}}" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
      <button type="button" aria-label="Account: Mei Chan" style="width:40px;height:40px;border:0;border-radius:20px;background:{{c.tc}};color:{{c.ontc}};font-size:14px;font-weight:700;outline:{{ring}};outline-offset:2px">MC</button>
    </header>
    <main style="flex:1;min-height:0;overflow:auto;padding:0 16px 16px">
      <label class="mm-field" style="position:relative;height:56px;border-radius:28px;background:{{c.high}};display:flex;align-items:center;gap:12px;padding:0 16px">
        <span style="width:24px;height:24px;flex:none;color:{{c.onv}};display:flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4"></path></svg></span>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search messages</span>
        <input type="text" value="{{q}}" onChange="{{onQ}}" placeholder="Search messages" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:{{c.on}};outline:none">
      </label>
      <div role="group" aria-label="Filter conversations" style="display:flex;gap:8px;margin:12px 0 8px">
        <sc-for list="{{chips}}" as="ch" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{ch.pressed}}" onClick="{{ch.pick}}" style="height:48px;padding:0 16px;border-radius:12px;border:{{ch.border}};background:{{ch.bg}};color:{{ch.fg}};font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px">
            <sc-if value="{{ch.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
            {{ch.label}}
          </button>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{convs}}" as="cv" hint-placeholder-count="6">
          <button type="button" class="mm-in" onClick="{{cv.pick}}" style="animation-delay:{{cv.delay}};min-height:72px;width:100%;border:0;border-radius:20px;background:{{c.low}};color:{{c.on}};padding:12px;text-align:left;display:flex;align-items:center;gap:12px">
            <span style="width:48px;height:48px;flex:none;border-radius:24px;background:{{cv.avBg}};color:{{cv.avFg}};font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">{{cv.ini}}</span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column">
              <span style="font-size:15px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{cv.name}}</span>
              <span style="font-size:13px;line-height:1.35;color:{{c.onv}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{cv.preview}}</span>
            </span>
            <span style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <span style="font-family:'Roboto Mono',monospace;font-size:12px;color:{{c.onv}}">{{cv.time}}</span>
              <sc-if value="{{cv.hasUnread}}" hint-placeholder-val="{{ true }}"><span style="min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:{{c.p}};color:{{c.onp}};font-size:12px;font-weight:700;line-height:24px;text-align:center">{{cv.unread}}</span></sc-if>
            </span>
          </button>
        </sc-for>
        <sc-if value="{{noConvs}}" hint-placeholder-val="{{ false }}"><p style="margin:8px 4px;font-size:14px;color:{{c.onv}}">No conversations match.</p></sc-if>
      </div>
    </main>
    <button type="button" aria-label="New message" style="position:absolute;right:16px;bottom:96px;width:56px;height:56px;border:0;border-radius:16px;background:{{c.pc}};color:{{c.onpc}};display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(27,27,33,.14)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg></button>
    <nav aria-label="Main navigation" style="height:80px;flex:none;background:{{c.cont}};display:flex;align-items:center;justify-content:space-around;padding:0 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" aria-current="{{n.cur}}" style="width:72px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:{{c.on}}">
          <span style="width:64px;height:32px;border-radius:16px;background:{{n.bg}};color:{{n.fg}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
          <span style="font-size:12px;line-height:16px;font-weight:{{n.w}}">{{n.label}}</span>
        </a>
      </sc-for>
    </nav>
  </sc-if>

  <sc-if value="{{isThread}}" hint-placeholder-val="{{ false }}">

      <button type="button" aria-label="Back to conversations" onClick="{{onBack}}" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.on}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <span style="width:40px;height:40px;flex:none;border-radius:20px;background:{{open.avBg}};color:{{open.avFg}};font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">{{open.ini}}</span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{open.name}}</span><span style="font-size:12px;color:{{c.onv}}">{{open.sub}}</span></span>
      <button type="button" aria-label="Conversation details" aria-expanded="{{sheetStr}}" onClick="{{openSheet}}" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
    </header>
    <main style="flex:1;min-height:0;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{thread}}" as="m" hint-placeholder-count="6">
        <div style="display:flex;justify-content:{{m.justify}};flex:none">
          <sc-if value="{{m.isSep}}" hint-placeholder-val="{{ false }}"><span style="margin:8px 0;height:28px;padding:0 12px;border-radius:10px;background:{{c.highest}};color:{{c.onv}};font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:28px">{{m.label}}</span></sc-if>
          <sc-if value="{{m.isMsg}}" hint-placeholder-val="{{ true }}">
            <div class="mm-in" style="max-width:82%;display:flex;flex-direction:column;align-items:{{m.align}};gap:2px">
              <sc-if value="{{m.showName}}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;color:{{c.onv}};padding:0 8px">{{m.name}}</span></sc-if>
              <div style="padding:10px 16px;border-radius:{{m.radius}};background:{{m.bg}};color:{{m.fg}};font-size:15px;line-height:1.45">{{m.text}}</div>
              <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:{{c.onv}};padding:0 8px">{{m.time}}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </main>
    <div style="flex:none;padding:8px 8px 16px;display:flex;align-items:center;gap:4px;background:{{c.bg}}">
      <button type="button" aria-label="Attach a file" style="width:48px;height:48px;flex:none;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.5 17a1.7 1.7 0 0 1-2.4-2.4l7-7"></path></svg></button>
      <label class="mm-field" style="position:relative;flex:1;min-width:0;height:56px;border-radius:28px;background:{{c.high}};display:flex;align-items:center;padding:0 20px">
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Write a message</span>
        <input type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="Write a message" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:{{c.on}};outline:none">
      </label>
      <button type="button" aria-label="Send message" onClick="{{onSend}}" style="width:56px;height:56px;flex:none;border:0;border-radius:28px;background:{{c.p}};color:{{c.onp}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L20 4l-5 16-3-7z"></path></svg></button>
    </div>
  </sc-if>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;top:0;right:0;bottom:0">
      <button type="button" aria-label="Close" onClick="{{closeSheet}}" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:rgba(27,27,33,.4)"></button>
      <div class="mm-sheet" role="dialog" aria-label="Details" style="position:absolute;left:0;right:0;bottom:0;max-height:640px;overflow:auto;padding:12px 16px 24px;border-radius:32px 32px 0 0;background:{{c.high}}">
        <div style="width:32px;height:4px;border-radius:2px;background:{{c.outline}};margin:0 auto 12px"></div>
        <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{listActions}}" as="la" hint-placeholder-count="3">
            <button type="button" onClick="{{closeSheet}}" style="width:100%;height:56px;border:0;border-radius:16px;background:transparent;color:{{c.on}};font-size:16px;text-align:left;display:flex;align-items:center;gap:16px;padding:0 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{la.d}}"></path></svg>{{la.label}}</button>
          </sc-for>
        </sc-if>
        <sc-if value="{{isThread}}" hint-placeholder-val="{{ false }}">
          <div style="font-size:20px;font-weight:650;line-height:1.3;margin:4px 0 8px">{{open.name}}</div>
          <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{c.onv}};margin:8px 0">Members</div>
          <sc-for list="{{open.members}}" as="mb" hint-placeholder-count="4">
            <div style="min-height:48px;display:flex;align-items:center;gap:12px"><span style="width:36px;height:36px;flex:none;border-radius:18px;background:{{mb.bg}};color:{{mb.fg}};font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">{{mb.ini}}</span><span style="font-size:15px;font-weight:500">{{mb.name}}</span></div>
          </sc-for>
          <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{c.onv}};margin:16px 0 8px">Shared files</div>
          <sc-for list="{{open.files}}" as="f" hint-placeholder-count="2">
            <div style="min-height:56px;display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;flex:none;border-radius:12px;background:{{c.pc}};color:{{c.onpc}};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM9 11h6M9 15h6"></path></svg></span><span style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:600">{{f.name}}</span><span style="font-family:'Roboto Mono',monospace;font-size:11px;color:{{c.onv}}">{{f.size}}</span></span></div>
          </sc-for>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":844}}'>

  convs() {

    cur.msgs.concat((s.sent[cur.id] || []).map((m) => ['out', '', m.text, m.time])).forEach((m) => {
      if (m[0] === 'sep') { thread.push({ isSep: true, isMsg: false, label: m[1], justify: 'center' }); return; }
      const own = m[0] === 'out';
      thread.push({ isSep: false, isMsg: true, justify: own ? 'flex-end' : 'flex-start', align: own ? 'flex-end' : 'flex-start', text: m[2], time: m[3], name: m[1], showName: !own && isGroup, bg: own ? c.p : c.high, fg: own ? c.onp : c.on, radius: own ? '20px 20px 6px 20px' : '20px 20px 20px 6px' });
    });
    const members = cur.members.map((n, i) => {
      const tt = tones[(i + cur.tone) % 5];
      return { name: n, ini: n.replace(/^(Dr\.|Prof\.) /, '').split(' ').map((p) => p[0]).join('').slice(0, 2), bg: tt[0], fg: tt[1] };
    });
    return {
      c, rootClass: motion ? '' : 'mm-still', ring: 'none', nav, convs, chips, noConvs: convs.length === 0,
      isList: s.open === null, isThread: s.open !== null,
      q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      onBack: () => this.setState({ open: null, sheet: false }),
      onSend: () => {
        const text = s.draft.trim();
        if (!text) return;
        const d = new Date();
        const time = this.pad(d.getHours()) + ':' + this.pad(d.getMinutes());
        const prev = s.sent[cur.id] || [];
        this.setState({ draft: '', sent: Object.assign({}, s.sent, { [cur.id]: prev.concat([{ text, time }]) }) });
      },
      thread,
      open: { name: cur.name, ini: cur.ini, sub: cur.sub, avBg: t[0], avFg: t[1], members, files: cur.files.map((f) => ({ name: f[0], size: f[1] })) },
      listActions: [
        { label:'New message', d:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4' },
        { label:'Mark all as read', d:'M5 12.5l4.5 4.500L19 7.500' },
        { label:'Message preferences', d:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4' }
      ],
      sheet: s.sheet, sheetStr: s.sheet ? 'true' : 'false',
      openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false })
    };
  }
}
</script>
