<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My courses, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@keyframes mm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mm-in{animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both}
.mm-still .mm-in{animation:none}
</style>
</helmet>
<div class="{{rootClass}}" style="width:1440px;height:900px;position:relative;overflow:hidden;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;background:{{c.bg}};color:{{c.on}}">

  <dc-import name="Rail" active="courses" initials="MC" accent="{{accent}}" dark="{{dark}}" hint-size="96px,900px"></dc-import>

  <div style="flex:1;min-width:0;height:900px;display:flex;flex-direction:column">
    <dc-import name="TopBar" title="Courses" accent="{{accent}}" dark="{{dark}}" hint-size="1344px,72px"></dc-import>

    <main style="flex:1;min-height:0;overflow:hidden;padding:24px 32px 32px">
      <div style="display:flex;flex-direction:column;gap:24px">

        <div style="display:flex;align-items:center;gap:16px">
          <div role="group" aria-label="Filter courses" style="flex:1;display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
              <button type="button" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="height:36px;padding:0 14px;border-radius:10px;border:1px solid {{chip.border}};background:{{chip.bg}};color:{{chip.fg}};font-size:14px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:6px;cursor:pointer">
                <sc-if value="{{chip.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
                {{chip.label}}
              </button>
            </sc-for>
          </div>
          <div style="position:relative">
            <button type="button" aria-haspopup="menu" aria-expanded="{{sortOpenStr}}" onClick="{{toggleSort}}" style="height:48px;padding:0 20px 0 16px;border-radius:999px;border:1px solid {{c.outline}};background:transparent;color:{{c.on}};font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h12M4 12h8M4 17h4M18 8v10M15 15l3 3 3-3"></path></svg>
              Sort: {{sortLabel}}
            </button>
            <sc-if value="{{sortOpen}}" hint-placeholder-val="{{ false }}">
              <div role="menu" aria-label="Sort courses" style="position:absolute;z-index:5;top:56px;right:0;width:240px;padding:8px;border-radius:20px;background:{{c.high}};box-shadow:{{c.shadow}}">
                <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
                  <button type="button" role="menuitemradio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="width:100%;height:48px;padding:0 16px;border:0;border-radius:14px;background:{{s.bg}};color:{{c.on}};font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left">
                    <span style="width:24px;display:flex"><sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
                    {{s.label}}
                  </button>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <div role="group" aria-label="Layout" style="display:flex;height:48px;border-radius:999px;border:1px solid {{c.outline}};overflow:hidden">
            <button type="button" aria-pressed="{{gridPressed}}" onClick="{{setGrid}}" style="min-width:96px;padding:0 16px;border:0;background:{{gridBg}};color:{{c.on}};font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
              Grid
            </button>
            <button type="button" aria-pressed="{{listPressed}}" onClick="{{setList}}" style="min-width:96px;padding:0 16px;border:0;border-left:1px solid {{c.outline}};background:{{listBg}};color:{{c.on}};font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>
              List
            </button>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:{{cols}};gap:{{gap}}">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
            <article class="mm-in" style="animation-delay:{{it.delay}};display:flex;flex-direction:{{it.dir}};border-radius:28px;background:{{c.low}};overflow:hidden">
              <div style="position:relative;flex:none;width:{{it.imgW}};height:{{it.imgH}};min-height:140px;background:{{it.imgBg}};overflow:hidden" aria-hidden="true">
                <div style="position:absolute;right:20px;bottom:-34px;width:128px;height:128px;border-radius:{{it.shapeR}};transform:rotate({{it.rot}});background:{{it.shape}}"></div>
                <div style="position:absolute;left:20px;top:20px;width:28px;height:28px;border-radius:9px;background:{{it.shape}};opacity:.55"></div>
              </div>
              <div style="flex:1;min-width:0;padding:24px;display:flex;flex-direction:column;gap:8px">
                <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{c.onv}}">{{it.code}}</div>
                <h2 style="margin:0;font-weight:650;font-size:20px;line-height:1.3">{{it.name}}</h2>
                <div style="font-size:14px;color:{{c.onv}}">{{it.teacher}}</div>
                <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
                  <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{it.pct}}" aria-label="Progress" style="flex:1;height:8px;border-radius:999px;background:{{c.highest}};overflow:hidden"><div style="width:{{it.pctW}};height:100%;border-radius:999px;background:{{c.p}}"></div></div>
                  <span style="font-family:'Roboto Mono',monospace;font-size:13px;font-weight:600">{{it.pct}}%</span>
                </div>
                <div style="display:flex;align-items:center;justify-content:flex-end;gap:0;margin:0 -8px -8px 0">
                  <button type="button" aria-pressed="{{it.starPressed}}" aria-label="{{it.starLabel}}" onClick="{{it.toggleStar}}" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:{{it.starColor}};display:flex;align-items:center;justify-content:center;cursor:pointer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="{{it.starFill}}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
                  </button>
                  <button type="button" aria-label="{{it.moreLabel}}" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center;cursor:pointer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
                  </button>
                </div>
              </div>
            </article>
          </sc-for>
        </div>

        <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
          <section aria-labelledby="rec-h">
            <h2 id="rec-h" style="margin:0 0 12px;font-weight:650;font-size:20px;line-height:1.3">Recently accessed</h2>
            <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
              <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
                <li>
                  <a href="#" style="display:flex;align-items:center;gap:16px;height:72px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:{{c.low}};color:{{c.on}};text-decoration:none">
                    <span style="width:40px;height:40px;flex:none;border-radius:12px;background:{{r.bg}};color:{{r.fg}};display:flex;align-items:center;justify-content:center">
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg>
                    </span>
                    <span style="flex:1;min-width:0">
                      <span style="display:block;font-weight:600;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</span>
                      <span style="display:block;font-size:14px;color:{{c.onv}}"><span style="font-family:'Roboto Mono',monospace">{{r.code}}</span> &middot; {{r.when}}</span>
                    </span>
                  </a>
                </li>
              </sc-for>
            </ul>
          </section>
        </sc-if>

        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
          <div style="padding:48px;border-radius:28px;background:{{c.low}};text-align:center">
            <div style="font-weight:650;font-size:20px">No courses here yet</div>
            <p style="margin:8px 0 0;font-size:16px;line-height:1.55;color:{{c.onv}}">Nothing matches the {{activeLabel}} filter. Pick All to see every course.</p>
          </div>
        </sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', filter: 'all', sort: 'recent', sortOpen: false, view: 'grid', starred: { BIO101: true, ENG210: true } };
  }
  palette(dark, accent) {
    const L = { bg:'#FBF8FF', low:'#F5F2FB', c:'#EFEDF6', high:'#E9E7F0', highest:'#E3E1EA', on:'#1B1B21', onv:'#45464F', outline:'#767680', ov:'#C6C5D0', p:accent, onp:'#FFFFFF', pc:'#DDE1FF', onpc:'#001454', sc:'#DEE1F9', onsc:'#171B2C', t:'#A23F6A', tc:'#FFD9E3', ontc:'#3E0021', ok:'#1F7A4D', okc:'#B7F1CF', wc:'#FFE08A', err:'#BA1A1A', shadow:'0 8px 28px rgba(27,27,33,.14)' };
    const D = { bg:'#131318', low:'#1B1B21', c:'#1F1F25', high:'#2A292F', highest:'#34343A', on:'#E4E1E9', onv:'#C6C5D0', outline:'#90909A', ov:'#45464F', p:'#B8C3FF', onp:'#002388', pc:'#2440BF', onpc:'#DDE1FF', sc:'#42455A', onsc:'#DEE1F9', t:'#FFB0CB', tc:'#842653', ontc:'#FFD9E3', ok:'#7CDBA6', okc:'#005234', wc:'#5B4300', err:'#FFB4AB', shadow:'0 8px 28px rgba(0,0,0,.4)' };
    return dark ? D : L;
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#3D5BD9';
    const motion = this.props.motion ?? true;
    const c = this.palette(dark, accent);
    const s = this.state;
    const courses = [
      { code:'BIO101', name:'Introduction to Biology', teacher:'Dr. Priya Nair', pct:68, recent:1, bg:c.pc, shape:c.p, r:'50%', rot:'0deg' },
      { code:'HIS120', name:'World History', teacher:'Prof. Daniel Okafor', pct:42, recent:3, bg:c.tc, shape:c.t, r:'32px', rot:'18deg' },
      { code:'ENG210', name:'Creative Writing', teacher:'Lena Hoffmann', pct:85, recent:2, bg:c.okc, shape:c.ok, r:'50%', rot:'0deg' },
      { code:'STA230', name:'Statistics with Python', teacher:'Dr. Tomas Vega', pct:15, recent:4, bg:c.sc, shape:c.t, r:'32px', rot:'-12deg' }
    ];
    const filters = { all:'All', progress:'In progress', notstarted:'Not started', completed:'Completed', starred:'Starred' };
    const test = {
      all: () => true,
      progress: (x) => x.pct > 0 && x.pct < 100,
      notstarted: (x) => x.pct === 0,
      completed: (x) => x.pct === 100,
      starred: (x) => !!s.starred[x.code]
    }[s.filter];
    const sorts = { recent:'Last accessed', name:'Name', progress:'Progress' };
    const sorter = {
      recent: (a, b) => a.recent - b.recent,
      name: (a, b) => a.name.localeCompare(b.name),
      progress: (a, b) => b.pct - a.pct
    }[s.sort];
    const grid = s.view === 'grid';
    const items = courses.filter(test).sort(sorter).map((x, i) => {
      const on = !!s.starred[x.code];
      return {
        code: x.code, name: x.name, teacher: x.teacher, pct: x.pct, pctW: x.pct + '%',
        delay: (i * 60) + 'ms',
        dir: grid ? 'column' : 'row', imgW: grid ? '100%' : '220px', imgH: grid ? '168px' : 'auto',
        imgBg: x.bg, shape: x.shape, shapeR: x.r, rot: x.rot,
        starPressed: on ? 'true' : 'false', starLabel: on ? 'Remove star from ' + x.name : 'Star ' + x.name,
        starColor: on ? c.t : c.onv, starFill: on ? 'currentColor' : 'none',
        toggleStar: () => this.setState({ starred: { ...s.starred, [x.code]: !on } }),
        moreLabel: 'More actions for ' + x.name
      };
    });
    const nav = [['Home','M4 11l8-7 8 7v9H4zM10 20v-6h4v6'],['Courses','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5'],['Calendar','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],['Grades','M4 20V10M10 20V4M16 20v-8M22 20H2'],['Messages','M4 5h16v11H8l-4 4z'],['Everything','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z']].map(([label, d]) => {
      const a = label === 'Courses';
      return { label, d, cur: a ? 'page' : 'false', bg: a ? c.sc : 'transparent', fg: a ? c.onsc : c.onv, w: a ? 700 : 500 };
    });
    return {
      c, accent, dark, rootClass: motion ? '' : 'mm-still',
      isGrid: grid,
      recent: [
        { title:'Cell structure lab report', code:'BIO101', when:'Today 09:40', d:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6', bg:c.pc, fg:c.onpc },
        { title:'Workshop: opening scene', code:'ENG210', when:'Yesterday 16:10', d:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4', bg:c.okc, fg:c.ok },
        { title:'Week 6 reading: the Silk Road', code:'HIS120', when:'Sat 11:25', d:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5', bg:c.tc, fg:c.ontc },
        { title:'Quiz 3: probability', code:'STA230', when:'Fri 10:00', d:'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01', bg:c.sc, fg:c.onsc },
        { title:'Pandas exercises', code:'STA230', when:'Thu 18:05', d:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6', bg:c.sc, fg:c.onsc },
        { title:'Forum: Writing prompts', code:'ENG210', when:'Wed 20:30', d:'M4 5h16v11H8l-4 4z', bg:c.okc, fg:c.ok }
      ],
      q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      chips: Object.keys(filters).map((k) => {
        const on = s.filter === k;
        return { label: filters[k], on, pressed: on ? 'true' : 'false', bg: on ? c.sc : 'transparent', fg: on ? c.onsc : c.onv, border: on ? c.sc : c.outline, pick: () => this.setState({ filter: k }) };
      }),
      activeLabel: filters[s.filter],
      sortLabel: sorts[s.sort], sortOpen: s.sortOpen, sortOpenStr: s.sortOpen ? 'true' : 'false',
      toggleSort: () => this.setState({ sortOpen: !s.sortOpen }),
      sorts: Object.keys(sorts).map((k) => ({ label: sorts[k], on: s.sort === k, checked: s.sort === k ? 'true' : 'false', bg: s.sort === k ? c.sc : 'transparent', pick: () => this.setState({ sort: k, sortOpen: false }) })),
      gridPressed: grid ? 'true' : 'false', listPressed: grid ? 'false' : 'true',
      gridBg: grid ? c.sc : 'transparent', listBg: grid ? 'transparent' : c.sc,
      setGrid: () => this.setState({ view: 'grid' }), setList: () => this.setState({ view: 'list' }),
      cols: grid ? 'repeat(4,minmax(0,1fr))' : 'minmax(0,1fr)', gap: grid ? '24px' : '16px',
      items, empty: items.length === 0
    };
  }
}
</script>
</body>
</html>
