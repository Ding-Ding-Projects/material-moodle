<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My courses, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@keyframes mm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mm-in{animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both}
.mm-still .mm-in{animation:none}
.mm-hs{scrollbar-width:none}
</style>
</helmet>
<div class="{{rootClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:'Roboto Flex',system-ui,sans-serif;background:{{c.bg}};color:{{c.on}}">

  <header style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px">
    <div style="flex:1;min-width:0;font-weight:650;font-size:20px;line-height:1.3">Courses</div>
    <button type="button" aria-label="Search" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4"></path></svg></button>
    <button type="button" aria-label="More options" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>
  </header>

  <main style="flex:1;min-height:0;overflow:auto;padding:0 16px 16px;scrollbar-width:none">
        <div style="position:relative;margin:0 -16px">
    <div role="group" aria-label="Filter courses" class="mm-hs" style="display:flex;gap:8px;padding:0 48px 0 16px;overflow-x:auto">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="flex:none;height:48px;padding:6px 0;border:0;background:transparent;cursor:pointer">
          <span style="height:36px;padding:0 14px;border-radius:10px;border:1px solid {{chip.border}};background:{{chip.bg}};color:{{chip.fg}};font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px">
            <sc-if value="{{chip.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
            {{chip.label}}
          </span>
        </button>
      </sc-for>
    </div>
    <div aria-hidden="true" style="position:absolute;top:0;right:0;width:32px;height:48px;pointer-events:none;background:linear-gradient(to right,transparent,{{c.bg}})"></div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin:4px 0 12px">
      <button type="button" aria-haspopup="dialog" onClick="{{openSort}}" style="flex:1;min-width:0;height:48px;padding:0 16px;border-radius:999px;border:1px solid {{c.outline}};background:transparent;color:{{c.on}};font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h12M4 12h8M4 17h4M18 8v10M15 15l3 3 3-3"></path></svg>
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sort: {{sortLabel}}</span>
      </button>
      <div role="group" aria-label="Layout" style="display:flex;height:48px;border-radius:999px;border:1px solid {{c.outline}};overflow:hidden">
        <button type="button" aria-pressed="{{gridPressed}}" aria-label="Grid" onClick="{{setGrid}}" style="width:56px;border:0;background:{{gridBg}};color:{{c.on}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></button>
        <button type="button" aria-pressed="{{listPressed}}" aria-label="List" onClick="{{setList}}" style="width:56px;border:0;border-left:1px solid {{c.outline}};background:{{listBg}};color:{{c.on}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <article class="mm-in" style="animation-delay:{{it.delay}};display:flex;flex-direction:{{it.dir}};border-radius:28px;background:{{c.low}};overflow:hidden">
          <div style="position:relative;flex:none;width:{{it.imgW}};height:{{it.imgH}};background:{{it.imgBg}};overflow:hidden" aria-hidden="true">
            <div style="position:absolute;right:16px;bottom:-28px;width:{{it.shapeSize}};height:{{it.shapeSize}};border-radius:{{it.shapeR}};transform:rotate({{it.rot}});background:{{it.shape}}"></div>
          </div>
          <div style="flex:1;min-width:0;padding:16px 8px 8px 20px;display:flex;flex-direction:column;gap:4px">
            <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{c.onv}}">{{it.code}}</div>
            <h2 style="margin:0;font-weight:650;font-size:18px;line-height:1.3">{{it.name}}</h2>
            <div style="font-size:14px;color:{{c.onv}}">{{it.teacher}}</div>
            <div style="display:flex;align-items:center;gap:12px;margin:4px 12px 0 0">
              <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{it.pct}}" aria-label="Progress" style="flex:1;height:8px;border-radius:999px;background:{{c.highest}};overflow:hidden"><div style="width:{{it.pctW}};height:100%;border-radius:999px;background:{{c.p}}"></div></div>
              <span style="font-family:'Roboto Mono',monospace;font-size:13px;font-weight:600">{{it.pct}}%</span>
            </div>
            <div style="display:flex;justify-content:flex-end">
              <button type="button" aria-pressed="{{it.starPressed}}" aria-label="{{it.starLabel}}" onClick="{{it.toggleStar}}" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:{{it.starColor}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{it.starFill}}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg></button>
              <button type="button" aria-haspopup="dialog" aria-label="{{it.moreLabel}}" onClick="{{it.openMore}}" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
            </div>
          </div>
        </article>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding:32px 24px;border-radius:28px;background:{{c.low}};text-align:center">
          <div style="font-weight:650;font-size:20px">No courses here yet</div>
          <p style="margin:8px 0 0;font-size:16px;line-height:1.55;color:{{c.onv}}">Nothing matches the {{activeLabel}} filter. Pick All to see every course.</p>
        </div>
      </sc-if>
    </div>
  </main>

  <dc-import name="PhoneNav" active="courses" accent="{{accent}}" dark="{{dark}}" hint-size="390px,80px"></dc-import>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:10">
      <button type="button" aria-label="Close" onClick="{{closeSheet}}" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:rgba(0,0,0,.42);cursor:pointer"></button>
      <div role="dialog" aria-label="{{sheetTitle}}" class="mm-in" style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;border-radius:32px 32px 0 0;background:{{c.high}};box-shadow:{{c.shadow}}">
        <div style="width:32px;height:4px;border-radius:2px;background:{{c.outline}};margin:0 auto 12px"></div>
        <div style="padding:0 8px 8px;font-weight:650;font-size:20px;line-height:1.3">{{sheetTitle}}</div>
        <sc-for list="{{sheetRows}}" as="r" hint-placeholder-count="4">
          <button type="button" role="menuitem" onClick="{{r.pick}}" style="width:100%;height:56px;padding:0 12px;border:0;border-radius:16px;background:{{r.bg}};color:{{c.on}};font-size:16px;font-weight:600;display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer">
            <span style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:{{c.onv}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
            {{r.label}}
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', sort: 'recent', view: 'grid', sheet: null, starred: { BIO101: true, ENG210: true } };
  }
  palette(dark, accent) {
    const L = { bg:'#FBF8FF', low:'#F5F2FB', c:'#EFEDF6', high:'#E9E7F0', highest:'#E3E1EA', on:'#1B1B21', onv:'#45464F', outline:'#767680', ov:'#C6C5D0', p:accent, onp:'#FFFFFF', pc:'#DDE1FF', onpc:'#001454', sc:'#DEE1F9', onsc:'#171B2C', t:'#A23F6A', tc:'#FFD9E3', ontc:'#3E0021', ok:'#1F7A4D', okc:'#B7F1CF', err:'#BA1A1A', shadow:'0 8px 28px rgba(27,27,33,.14)' };
    const D = { bg:'#131318', low:'#1B1B21', c:'#1F1F25', high:'#2A292F', highest:'#34343A', on:'#E4E1E9', onv:'#C6C5D0', outline:'#90909A', ov:'#45464F', p:'#B8C3FF', onp:'#002388', pc:'#2440BF', onpc:'#DDE1FF', sc:'#42455A', onsc:'#DEE1F9', t:'#FFB0CB', tc:'#842653', ontc:'#FFD9E3', ok:'#7CDBA6', okc:'#005234', err:'#FFB4AB', shadow:'0 8px 28px rgba(0,0,0,.4)' };
    return dark ? D : L;
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#3D5BD9';
    const motion = this.props.motion ?? true;
    const c = this.palette(dark, accent);
    const s = this.state;
    const courses = [
      { code:'BIO101', name:'Introduction to Biology', teacher:'Dr. Priya Nair', pct:68, recent:1, bg:c.pc, shape:c.p, r:'50%', rot:'0deg' },
      { code:'HIS120', name:'World History', teacher:'Prof. Daniel Okafor', pct:42, recent:3, bg:c.tc, shape:c.t, r:'28px', rot:'18deg' },
      { code:'ENG210', name:'Creative Writing', teacher:'Lena Hoffmann', pct:85, recent:2, bg:c.okc, shape:c.ok, r:'50%', rot:'0deg' },
      { code:'STA230', name:'Statistics with Python', teacher:'Dr. Tomas Vega', pct:15, recent:4, bg:c.sc, shape:c.t, r:'28px', rot:'-12deg' }
    ];
    const filters = { all:'All', progress:'In progress', notstarted:'Not started', completed:'Completed', starred:'Starred' };
    const test = {
      all: () => true,
      progress: (x) => x.pct > 0 && x.pct < 100,
      notstarted: (x) => x.pct === 0,
      completed: (x) => x.pct === 100,
      starred: (x) => !!s.starred[x.code]
    }[s.filter];
    const sorts = { recent:'Last accessed', name:'Name', progress:'Progress' };
    const sorter = { recent: (a, b) => a.recent - b.recent, name: (a, b) => a.name.localeCompare(b.name), progress: (a, b) => b.pct - a.pct }[s.sort];
    const grid = s.view === 'grid';
    const close = () => this.setState({ sheet: null });
    const items = courses.filter(test).sort(sorter).map((x, i) => {
      const on = !!s.starred[x.code];
      return {
        code: x.code, name: x.name, teacher: x.teacher, pct: x.pct, pctW: x.pct + '%', delay: (i * 60) + 'ms',
        dir: grid ? 'column' : 'row', imgW: grid ? '100%' : '88px', imgH: grid ? '104px' : 'auto', shapeSize: grid ? '104px' : '72px',
        imgBg: x.bg, shape: x.shape, shapeR: x.r, rot: x.rot,
        starPressed: on ? 'true' : 'false', starLabel: on ? 'Remove star from ' + x.name : 'Star ' + x.name,
        starColor: on ? c.t : c.onv, starFill: on ? 'currentColor' : 'none',
        toggleStar: () => this.setState({ starred: { ...s.starred, [x.code]: !on } }),
        moreLabel: 'More actions for ' + x.name, openMore: () => this.setState({ sheet: x.code })
      };
    });
    let sheetTitle = '', sheetRows = [];
    if (s.sheet === 'sort') {
      sheetTitle = 'Sort courses';
      sheetRows = Object.keys(sorts).map((k) => ({ label: sorts[k], d: s.sort === k ? 'M5 12l5 5 9-10' : 'M12 12h.01', bg: s.sort === k ? c.sc : 'transparent', pick: () => this.setState({ sort: k, sheet: null }) }));
    } else if (s.sheet) {
      const cur = courses.find((x) => x.code === s.sheet);
      const on = !!s.starred[s.sheet];
      sheetTitle = cur.name;
      sheetRows = [
        { label: 'Open course', d: 'M5 12h14M13 6l6 6-6 6', bg: 'transparent', pick: close },
        { label: on ? 'Remove star' : 'Star course', d: 'M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z', bg: 'transparent', pick: () => this.setState({ starred: { ...s.starred, [s.sheet]: !on }, sheet: null }) },
        { label: 'Grades', d: 'M4 20V10M10 20V4M16 20v-8M22 20H2', bg: 'transparent', pick: close },
        { label: 'Hide from My courses', d: 'M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6zM4 4l16 16', bg: 'transparent', pick: close }
      ];
    }
    const nav = [['Home','M4 11l8-7 8 7v9H4zM10 20v-6h4v6'],['Courses','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5'],['Calendar','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],['Messages','M4 5h16v11H8l-4 4z'],['Everything','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z']].map(([label, d]) => {
      const a = label === 'Courses';
      return { label, d, cur: a ? 'page' : 'false', bg: a ? c.sc : 'transparent', fg: a ? c.onsc : c.onv, w: a ? 700 : 500 };
    });
    return {
      c, accent, dark, items, empty: items.length === 0, rootClass: motion ? '' : 'mm-still',
      chips: Object.keys(filters).map((k) => {
        const on = s.filter === k;
        return { label: filters[k], on, pressed: on ? 'true' : 'false', bg: on ? c.sc : 'transparent', fg: on ? c.onsc : c.onv, border: on ? c.sc : c.outline, pick: () => this.setState({ filter: k }) };
      }),
      activeLabel: filters[s.filter], sortLabel: sorts[s.sort],
      openSort: () => this.setState({ sheet: 'sort' }),
      gridPressed: grid ? 'true' : 'false', listPressed: grid ? 'false' : 'true',
      gridBg: grid ? c.sc : 'transparent', listBg: grid ? 'transparent' : c.sc,
      setGrid: () => this.setState({ view: 'grid' }), setList: () => this.setState({ view: 'list' }),
      sheetOpen: !!s.sheet, sheetTitle, sheetRows, closeSheet: close
    };
  }
}
</script>
</body>
</html>
