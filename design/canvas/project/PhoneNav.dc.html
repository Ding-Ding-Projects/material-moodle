<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone navigation bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mm-bnav a:focus-visible{outline:3px solid currentColor;outline-offset:-3px}
</style>
</helmet>
<nav class="mm-bnav" aria-label="Main" style="width:390px;height:80px;box-sizing:border-box;padding:12px 8px 16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-family:'Roboto Flex',system-ui,sans-serif;background:{{c.container}}">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
    <a href="#" aria-current="{{it.current}}" style="min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:{{it.fg}}">
      <span style="width:64px;height:32px;border-radius:16px;background:{{it.pill}};color:{{it.iconFg}};display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
      </span>
      <span style="font-size:12px;font-weight:{{it.weight}}">{{it.label}}</span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","courses","calendar","messages","everything","none"],"default":"home","section":"Navigation"},"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const active = this.props.active ?? 'home';
    const c = dark
      ? { container:'#1F1F25', secondaryContainer:'#42455A', onSecondaryContainer:'#DEE1F9', onSurface:'#E4E1E9', onSurfaceVariant:'#C6C5D0' }
      : { container:'#EFEDF6', secondaryContainer:'#DEE1F9', onSecondaryContainer:'#171B2C', onSurface:'#1B1B21', onSurfaceVariant:'#45464F' };
    const list = [
      ['home','Home','M4 11l8-7 8 7v9h-5v-6H9v6H4z'],
      ['courses','Courses','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5'],
      ['calendar','Calendar','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
      ['messages','Messages','M4 5h16v11H8l-4 4z'],
      ['everything','Everything','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z']
    ];
    const items = list.map(([k, label, d]) => {
      const on = active === k;
      return { label, d, current: on ? 'page' : 'false', pill: on ? c.secondaryContainer : 'transparent', iconFg: on ? c.onSecondaryContainer : c.onSurfaceVariant, fg: on ? c.onSurface : c.onSurfaceVariant, weight: on ? 700 : 500 };
    });
    return { c, items };
  }
}
</script>
</body>
</html>
