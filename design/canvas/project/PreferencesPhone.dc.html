<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preferences phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
@keyframes mm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mm-still *{animation:none!important;transition:none!important}
.mm-headline{font-weight:750;font-stretch:112%;font-size:26px;line-height:1.1;margin:0}
.mm-title{font-weight:650;font-size:20px;line-height:1.3}
.mm-label{font-weight:600;font-size:14px;letter-spacing:.01em}
.mm-mono{font-family:'Roboto Mono',monospace}
.mm-btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--mm-ring);outline-offset:2px}
.mm-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="{{rootClass}}" style="position:relative;width:390px;height:844px;overflow:hidden;background:{{c.surface}};color:{{c.on}};font-family:'Roboto Flex',system-ui,sans-serif;font-size:16px;line-height:1.55;--mm-ring:{{c.primary}}">
  <header style="position:absolute;left:0;top:0;width:390px;height:64px;display:flex;align-items:center;gap:4px;padding:0 8px 0 8px;box-sizing:border-box;z-index:2;background:{{c.surface}}">
    <sc-if value="{{inSection}}" hint-placeholder-val="{{ false }}"><button type="button" class="mm-btn" aria-label="Back to preferences" onClick="{{back}}" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.on}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></sc-if>
    <div class="mm-title" style="flex:1;padding-left:{{titlePad}}">{{screenTitle}}</div>
    <button type="button" class="mm-btn" aria-label="More actions" aria-haspopup="menu" aria-expanded="{{menuStr}}" onClick="{{toggleMenu}}" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{c.onv}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
    <span role="img" aria-label="Mei Chan" style="width:40px;height:40px;border-radius:20px;background:{{c.tc}};color:{{c.ontc}};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">MC</span>
  </header>

  <sc-if value="{{inList}}" hint-placeholder-val="{{ true }}">
    <main class="mm-scroll" style="position:absolute;left:0;top:64px;width:390px;height:700px;overflow-y:auto;box-sizing:border-box;padding:0 16px 24px;display:flex;flex-direction:column;gap:16px">
      <h1 class="mm-headline">Preferences</h1>
      <div style="border-radius:28px;background:{{c.low}};padding:8px 0">
        <sc-for list="{{sections}}" as="p" hint-placeholder-count="7">
          <button type="button" class="mm-btn" onClick="{{p.pick}}" style="width:100%;height:72px;padding:0 16px;border:0;background:transparent;color:{{c.on}};display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left">
            <span style="width:40px;height:40px;flex:none;border-radius:12px;background:{{c.sc}};color:{{c.onsc}};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg></span>
            <span style="flex:1;min-width:0"><span style="display:block;font-weight:600">{{p.label}}</span><span style="display:block;font-size:14px;color:{{c.onv}}">{{p.sub}}</span></span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{c.onv}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </main>
  </sc-if>

  <sc-if value="{{inSection}}" hint-placeholder-val="{{ false }}">
    <main class="mm-scroll" style="position:absolute;left:0;top:64px;width:390px;height:628px;overflow-y:auto;box-sizing:border-box;padding:0 16px 16px;display:flex;flex-direction:column;gap:16px">
      <div><h1 class="mm-headline">{{section}}</h1><p style="margin:4px 0 0;color:{{c.onv}}">{{sectionIntro}}</p></div>
      <sc-if value="{{otherSection}}" hint-placeholder-val="{{ false }}"><div style="padding:24px;border-radius:28px;background:{{c.low}};color:{{c.onv}}">{{section}} has its own page. This board shows the Display section.</div></sc-if>
      <sc-if value="{{isDisplay}}" hint-placeholder-val="{{ true }}">
        <section style="border-radius:28px;background:{{c.low}};padding:20px;display:flex;flex-direction:column;gap:12px">
          <div class="mm-label">Theme</div>
          <div role="group" aria-label="Theme" style="display:flex;height:48px;border:1px solid {{c.outline}};border-radius:999px;overflow:hidden">
            <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
              <button type="button" class="mm-btn" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="flex:1;border:0;border-left:{{t.divider}};background:{{t.bg}};color:{{t.fg}};display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>{{t.label}}</button>
            </sc-for>
          </div>
        </section>
        <section style="border-radius:28px;background:{{c.low}};padding:20px;display:flex;flex-direction:column;gap:12px">
          <div class="mm-label">Motion</div>
          <div role="group" aria-label="Motion" style="display:flex;height:48px;border:1px solid {{c.outline}};border-radius:999px;overflow:hidden">
            <sc-for list="{{motions}}" as="t" hint-placeholder-count="3">
              <button type="button" class="mm-btn" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="flex:1;border:0;border-left:{{t.divider}};background:{{t.bg}};color:{{t.fg}};display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>{{t.label}}</button>
            </sc-for>
          </div>
        </section>
        <section style="border-radius:28px;background:{{c.low}};padding:20px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><label for="mm-size" class="mm-label">Text size</label><span class="mm-mono" style="font-size:14px;color:{{c.onv}}">{{size}} px</span></div>
          <input id="mm-size" type="range" min="14" max="22" step="1" value="{{size}}" onChange="{{onSize}}" style="width:100%;height:48px;margin:0;accent-color:{{c.primary}}">
          <p style="margin:0;padding:16px;border-radius:16px;background:{{c.cont}};font-size:{{size}}px;line-height:1.5">Cell structure lab report is due on Tuesday at 14:00.</p>
        </section>
        <section style="border-radius:28px;background:{{c.low}};padding:4px 20px">
          <sc-for list="{{switches}}" as="w" hint-placeholder-count="3">
            <div style="min-height:72px;display:flex;align-items:center;gap:16px">
              <span style="flex:1;min-width:0"><span id="{{w.id}}" style="display:block;font-weight:600">{{w.label}}</span><span style="display:block;font-size:14px;color:{{c.onv}}">{{w.sub}}</span></span>
              <button type="button" role="switch" class="mm-btn" aria-checked="{{w.checked}}" aria-labelledby="{{w.id}}" onClick="{{w.toggle}}" style="width:52px;height:32px;flex:none;padding:0;border:0;border-radius:16px;background:{{w.bg}};position:relative;cursor:pointer"><span style="position:absolute;top:4px;left:{{w.left}};width:24px;height:24px;border-radius:12px;background:{{w.thumb}};transition:left .25s cubic-bezier(.2,0,0,1.4)"></span></button>
            </div>
          </sc-for>
        </section>
        <section style="border-radius:28px;background:{{c.low}};padding:20px;display:flex;flex-direction:column;gap:8px">
          <label for="mm-lang" class="mm-label">Language</label>
          <select id="mm-lang" value="{{lang}}" onChange="{{onLang}}" style="height:56px;padding:0 16px;border:0;border-radius:16px;background:{{c.highest}};color:{{c.on}};font-size:16px">
            <option value="English">English</option>
            <option value="Cantonese">Cantonese</option>
            <option value="Both">English / Cantonese</option>
          </select>
        </section>
      </sc-if>
    </main>
    <div style="position:absolute;left:0;bottom:80px;width:390px;height:72px;box-sizing:border-box;padding:0 8px 0 16px;background:{{c.cont}};border-radius:28px 28px 0 0;display:flex;align-items:center;gap:4px;z-index:2">
      <span aria-live="polite" style="flex:1;font-size:13px;line-height:1.3;color:{{c.onv}}">{{status}}</span>
      <button type="button" class="mm-btn mm-label" onClick="{{reset}}" style="height:48px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:{{c.primary}};cursor:pointer">Reset</button>
      <button type="button" class="mm-btn mm-label" onClick="{{save}}" style="height:48px;padding:0 20px;border:0;border-radius:999px;background:{{c.primary}};color:{{c.onp}};cursor:pointer">Save changes</button>
    </div>
  </sc-if>

  <sc-if value="{{menu}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:4">
      <div onClick="{{toggleMenu}}" style="position:absolute;left:0;top:0;width:390px;height:844px"></div>
      <div role="menu" aria-label="More actions" style="position:absolute;right:8px;top:56px;width:248px;box-sizing:border-box;padding:8px 0;border-radius:20px;background:{{c.high}};box-shadow:0 8px 28px rgba(27,27,33,.14);animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both">
        <sc-for list="{{menuItems}}" as="m" hint-placeholder-count="6">
          <button type="button" role="menuitem" class="mm-btn" onClick="{{toggleMenu}}" style="width:100%;height:48px;padding:0 16px;border:0;background:transparent;color:{{c.on}};display:flex;align-items:center;gap:16px;font-size:16px;cursor:pointer;text-align:left"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:{{c.onv}}"><path d="{{m.d}}"></path></svg>{{m.label}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <nav aria-label="Main navigation" style="position:absolute;left:0;bottom:0;width:390px;height:80px;box-sizing:border-box;background:{{c.cont}};display:flex;z-index:3">
    <sc-for list="{{nav}}" as="r" hint-placeholder-count="5">
      <button type="button" class="mm-btn" aria-label="{{r.label}}" style="flex:1;border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{c.on}}">
        <span style="width:64px;height:32px;border-radius:16px;background:{{r.bg}};color:{{r.fg}};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
        <span style="font-size:12px;font-weight:600;line-height:15px">{{r.label}}</span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { section: '', menu: false, theme: 'Auto', motion: 'Expressive', size: 16, sw: { transparency: false, touch: true, links: true }, lang: 'Both', dirty: false, saved: false }; }
  renderVals() {
    const s = this.state;
    const L = { pc:'#DDE1FF', onpc:'#001454', sc:'#DEE1F9', onsc:'#171B2C', tc:'#FFD9E3', ontc:'#3E0021', err:'#BA1A1A', surface:'#FBF8FF', low:'#F5F2FB', cont:'#EFEDF6', high:'#E9E7F0', highest:'#E3E1EA', on:'#1B1B21', onv:'#45464F', outline:'#767680', ov:'#C6C5D0', onp:'#FFFFFF' };
    const D = { pc:'#2440BF', onpc:'#DDE1FF', sc:'#42455A', onsc:'#DEE1F9', tc:'#842653', ontc:'#FFD9E3', err:'#FFB4AB', surface:'#131318', low:'#1B1B21', cont:'#1F1F25', high:'#2A292F', highest:'#34343A', on:'#E4E1E9', onv:'#C6C5D0', outline:'#90909A', ov:'#45464F', onp:'#002388' };
    const dark = s.theme === 'Dark' || (s.theme === 'Auto' && (this.props.dark ?? false));
    const accent = this.props.accent ?? '#3D5BD9';
    const still = !(this.props.motion ?? true) || s.motion === 'Off';
    const c = Object.assign({}, dark ? D : L, { primary: dark ? '#B8C3FF' : accent });
    const mark = (patch) => this.setState(Object.assign({ dirty: true, saved: false }, patch));
    const NL = [['Home','M4 11l8-7 8 7v9H4zM10 20v-6h4v6'],['Courses','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5'],['Calendar','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],['Messages','M4 5h16v11H8l-4 4z'],['Everything','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z']];
    const nav = NL.map(([label, d]) => ({ label, d, bg: label === 'Everything' ? c.sc : 'transparent', fg: label === 'Everything' ? c.onsc : c.onv }));
    const menuItems = [['Search','M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4'],['New','M12 5v14M5 12h14'],['Display settings','M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6'],['Notifications','M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4'],['Help','M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01'],['Grades','M4 20V10M10 20V4M16 20v-8M22 20H2']].map(([label, d]) => ({ label, d }));
    const SL = [['Account','Name, email and password','M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21a8 8 0 0 1 16 0'],['Display','Theme, motion and text size','M4 5h16v11H4zM8 20h8M12 16v4'],['Language','Interface language','M3 6h10M8 4v2M5 6c1 4 3 6 6 7M11 6c-1 4-3 6-6 7M13 20l4-9 4 9M14.5 17h5'],['Notifications','Email and mobile alerts','M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4'],['Editor','Text editor choices','M4 20h4L19 9l-4-4L4 16zM14 6l4 4'],['Privacy','Your data and visibility','M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'],['Passkeys','Sign in without a password','M7.5 9a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM11 13L21 3M17 7l3 3']];
    const sections = SL.map(([label, sub, d]) => ({ label, sub, d, pick: () => this.setState({ section: label }) }));
    const seg = (list, key) => list.map((label, i) => ({
      label, on: s[key] === label, pressed: s[key] === label ? 'true' : 'false', divider: i ? '1px solid ' + c.outline : '0',
      bg: s[key] === label ? c.sc : 'transparent', fg: s[key] === label ? c.onsc : c.on, pick: () => mark({ [key]: label })
    }));
    const SW = [['transparency','Reduce transparency','Use solid surfaces'],['touch','Larger touch targets','Make rows at least 56 px tall'],['links','Underline links','Underline links inside text']];
    const switches = SW.map(([k, label, sub]) => ({
      id: 'mm-sw-' + k, label, sub, checked: s.sw[k] ? 'true' : 'false', bg: s.sw[k] ? c.primary : c.highest, thumb: s.sw[k] ? c.onp : c.outline, left: s.sw[k] ? '24px' : '4px',
      toggle: () => mark({ sw: Object.assign({}, s.sw, { [k]: !s.sw[k] }) })
    }));
    const inSection = s.section !== '';
    return {
      c, rootClass: still ? 'mm-still' : '', nav, menuItems, sections, switches,
      inSection, inList: !inSection, back: () => this.setState({ section: '' }),
      screenTitle: inSection ? s.section : 'Settings', titlePad: inSection ? '0' : '8px',
      section: s.section, sectionIntro: s.section === 'Display' ? 'How Riverside College looks and moves on this device.' : 'Change how this section behaves.',
      isDisplay: s.section === 'Display', otherSection: inSection && s.section !== 'Display',
      menu: s.menu, menuStr: s.menu ? 'true' : 'false', toggleMenu: () => this.setState({ menu: !s.menu }),
      themes: seg(['Light', 'Dark', 'Auto'], 'theme'), motions: seg(['Expressive', 'Calm', 'Off'], 'motion'),
      size: s.size, onSize: (e) => mark({ size: Number(e.target.value) }),
      lang: s.lang, onLang: (e) => mark({ lang: e.target.value }),
      status: s.saved ? 'Saved on all your devices.' : s.dirty ? 'You have unsaved changes.' : 'No changes yet.',
      save: () => this.setState({ saved: true, dirty: false }),
      reset: () => this.setState({ theme: 'Auto', motion: 'Expressive', size: 16, sw: { transparency: false, touch: true, links: true }, lang: 'Both', dirty: false, saved: false })
    };
  }
}
</script>
</body>
</html>
