<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>States</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
@keyframes mm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mm-still *{animation:none!important;transition:none!important}
.mm-display{font-weight:800;font-stretch:118%;font-size:56px;line-height:1.02;letter-spacing:-.02em;margin:0}
.mm-headline{font-weight:750;font-stretch:112%;font-size:32px;line-height:1.1;margin:0}
.mm-title{font-weight:650;font-size:20px;line-height:1.3}
.mm-label{font-weight:600;font-size:14px;letter-spacing:.01em}
.mm-mono{font-family:'Roboto Mono',monospace}
.mm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mm-btn:focus-visible{outline:3px solid var(--mm-ring);outline-offset:2px}
.mm-field:focus-within{outline:2px solid var(--mm-ring)}
</style>
</helmet>
<div class="{{rootClass}}" style="position:relative;width:1440px;height:900px;overflow:hidden;display:flex;background:{{c.surface}};color:{{c.on}};font-family:'Roboto Flex',system-ui,sans-serif;font-size:16px;line-height:1.55;--mm-ring:{{c.primary}}">
  <div style="width:96px;flex:none;height:900px">
    <dc-import name="Rail" active="none" initials="MC" accent="{{accent}}" dark="{{dark}}" hint-size="96px,900px"></dc-import>
  </div>

  <div style="flex:1;min-width:0;height:900px;display:flex;flex-direction:column">
    <div style="width:1344px;height:72px;flex:none">
      <dc-import name="TopBar" title="States" accent="{{accent}}" dark="{{dark}}" hint-size="1344px,72px"></dc-import>
    </div>

    <main style="flex:1;min-height:0;padding:24px 32px;box-sizing:border-box;display:flex">
      <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px">
        <sc-for list="{{cards}}" as="k" hint-placeholder-count="4">
          <section style="min-height:0;box-sizing:border-box;border-radius:36px;background:{{c.low}};padding:24px;display:flex;flex-direction:column;gap:8px;animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both;animation-delay:{{k.delay}}">
            <div aria-hidden="true" style="height:124px;flex:none;margin-bottom:8px;border-radius:28px;background:{{k.bg}};position:relative;overflow:hidden">
              <span style="position:absolute;left:60px;top:20px;width:84px;height:84px;border-radius:50%;background:{{k.s1}}"></span>
              <span style="position:absolute;left:250px;top:26px;width:72px;height:72px;border-radius:20px;background:{{k.s2}};transform:rotate(12deg)"></span>
              <span style="position:absolute;left:400px;top:42px;width:140px;height:40px;border-radius:999px;background:{{k.s3}}"></span>
            </div>
            <span class="mm-over" style="color:{{k.tone}}">{{k.kind}}</span>
            <h2 class="mm-headline">{{k.title}}</h2>
            <p style="margin:0;min-height:50px;color:{{c.onv}}">{{k.body}}</p>
            <div style="margin-top:auto"><button type="button" class="mm-btn mm-label" onClick="{{k.act}}" style="height:48px;padding:0 24px;border:0;border-radius:999px;background:{{k.btnBg}};color:{{k.btnFg}};cursor:pointer">{{k.button}}</button></div>
          </section>
        </sc-for>
      </div>
    </main>
  </div>

  <sc-if value="{{snack}}" hint-placeholder-val="{{ true }}">
    <div role="status" style="position:absolute;left:520px;bottom:32px;min-width:320px;height:48px;box-sizing:border-box;padding:0 8px 0 16px;border-radius:12px;background:{{c.on}};color:{{c.surface}};display:flex;align-items:center;gap:16px;font-size:14px;box-shadow:0 8px 28px rgba(27,27,33,.14);animation:mm-in 420ms cubic-bezier(.05,.7,.1,1) both"><span style="flex:1">{{snackText}}</span><button type="button" class="mm-btn mm-label" onClick="{{dismiss}}" style="height:48px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:{{c.inv}};cursor:pointer">Dismiss</button></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { snack: '' }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#3D5BD9';
    const motion = this.props.motion ?? true;
    const L = { pc:'#DDE1FF', onpc:'#001454', sc:'#DEE1F9', onsc:'#171B2C', tc:'#FFD9E3', ontc:'#3E0021', tert:'#A23F6A', suc:'#1F7A4D', sucC:'#B7F1CF', onsucC:'#002111', warnC:'#FFE08A', onwarnC:'#251A00', err:'#BA1A1A', errC:'#FFDAD6', onerrC:'#410002', surface:'#FBF8FF', low:'#F5F2FB', cont:'#EFEDF6', high:'#E9E7F0', highest:'#E3E1EA', on:'#1B1B21', onv:'#45464F', outline:'#767680', ov:'#C6C5D0', onp:'#FFFFFF', inv:'#B8C3FF' };
    const D = { pc:'#2440BF', onpc:'#DDE1FF', sc:'#42455A', onsc:'#DEE1F9', tc:'#842653', ontc:'#FFD9E3', tert:'#FFB0CB', suc:'#7CDBA6', sucC:'#005234', onsucC:'#B7F1CF', warnC:'#5B4300', onwarnC:'#FFE08A', err:'#FFB4AB', errC:'#93000A', onerrC:'#FFDAD6', surface:'#131318', low:'#1B1B21', cont:'#1F1F25', high:'#2A292F', highest:'#34343A', on:'#E4E1E9', onv:'#C6C5D0', outline:'#90909A', ov:'#45464F', onp:'#002388', inv:'#2440BF' };
    const c = Object.assign({}, dark ? D : L, { primary: dark ? '#B8C3FF' : accent });
    const say = (t) => () => this.setState({ snack: t });
    const cards = [
      { kind: 'Empty course', title: 'Nothing here yet', body: 'Introduction to Biology has no activities. Add a first one so learners have something to open.', button: 'Add an activity', bg: c.pc, tone: c.primary, btnBg: c.primary, btnFg: c.onp, act: say('Opening the activity chooser for Introduction to Biology'), s1: c.primary, s2: c.tert, s3: c.suc },
      { kind: 'Nothing due', title: 'You are all caught up', body: 'No assignments or quizzes are due this week. Enjoy the quiet, or plan ahead.', button: 'Open calendar', bg: c.sucC, tone: c.suc, btnBg: c.suc, btnFg: dark ? '#003822' : '#FFFFFF', act: say('Opening your calendar'), s1: c.suc, s2: c.primary, s3: c.warnC },
      { kind: 'Page not found', title: 'We cannot find that page', body: 'The link may be old, or the page may have moved. Check the address or start from your dashboard.', button: 'Go to dashboard', bg: c.errC, tone: c.err, btnBg: c.primary, btnFg: c.onp, act: say('Going to your dashboard'), s1: c.err, s2: c.onerrC, s3: c.primary },
      { kind: 'You are offline', title: 'No connection', body: 'Your changes are saved on this device and will sync when you are back online.', button: 'Try again', bg: c.warnC, tone: c.onwarnC, btnBg: c.primary, btnFg: c.onp, act: say('Trying to reconnect'), s1: c.onwarnC, s2: c.err, s3: c.outline }
    ].map((k, i) => Object.assign({ delay: i * 70 + 'ms' }, k));
    return {
      c, accent, dark, rootClass: motion ? '' : 'mm-still', cards,
      snack: !!this.state.snack, snackText: this.state.snack, dismiss: () => this.setState({ snack: '' })
    };
  }
}
</script>
</body>
</html>
