<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mm-top button:focus-visible{outline:3px solid currentColor;outline-offset:2px}
</style>
</helmet>
<header class="mm-top" style="width:1344px;height:72px;box-sizing:border-box;padding:0 16px 0 32px;display:grid;grid-template-columns:minmax(0,1fr) 560px minmax(0,1fr);align-items:center;gap:24px;font-family:'Roboto Flex',system-ui,sans-serif;background:{{c.surface}};color:{{c.onSurface}}">
  <p style="margin:0;font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{title}}</p>
  <label style="height:56px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;border-radius:999px;background:{{c.high}};color:{{c.onSurfaceVariant}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="flex:none"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4"></path></svg>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
    <input type="search" placeholder="Search courses, people and settings" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:{{c.onSurface}};outline:none">
    <span aria-hidden="true" style="flex:none;height:28px;padding:0 8px;border-radius:8px;background:{{c.surface}};display:grid;place-items:center;font-size:12px;font-weight:650">Ctrl K</span>
    <button type="button" aria-label="Use a regular expression" aria-pressed="{{regexStr}}" onClick="{{toggleRegex}}" style="flex:none;width:40px;height:40px;border:0;border-radius:50%;background:{{regexBg}};color:{{regexFg}};font-family:'Roboto Mono',monospace;font-weight:700;font-size:14px;cursor:pointer">.*</button>
  </label>
  <div style="display:flex;justify-content:flex-end;gap:4px">
    <button type="button" aria-label="Display settings" style="width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:{{c.onSurfaceVariant}};display:grid;place-items:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M16 4v4M10 10v4M18 16v4"></path></svg>
    </button>
    <button type="button" aria-label="Notifications, 2 unread" style="position:relative;width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:{{c.onSurfaceVariant}};display:grid;place-items:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4"></path></svg>
      <span aria-hidden="true" style="position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:{{c.error}}"></span>
    </button>
    <button type="button" aria-label="Help" style="width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:{{c.onSurfaceVariant}};display:grid;place-items:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"></path></svg>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Home","section":"Top bar"},"accent":{"editor":"color","default":"#3D5BD9","options":["#3D5BD9","#A23F6A","#1F7A4D","#8B5000"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1344,"height":72}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { regex: false }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#3D5BD9';
    const c = dark
      ? { surface:'#131318', high:'#2A292F', onSurface:'#E4E1E9', onSurfaceVariant:'#C6C5D0', error:'#FFB4AB', primary:'#B8C3FF', onPrimary:'#002388' }
      : { surface:'#FBF8FF', high:'#E9E7F0', onSurface:'#1B1B21', onSurfaceVariant:'#45464F', error:'#BA1A1A', primary:accent, onPrimary:'#FFFFFF' };
    const on = this.state.regex;
    return { c, title: this.props.title ?? 'Home', regexStr: on ? 'true' : 'false', regexBg: on ? c.primary : c.surface, regexFg: on ? c.onPrimary : c.onSurfaceVariant,
      toggleRegex: () => this.setState({ regex: !on }) };
  }
}
</script>
</body>
</html>
