#!/usr/sbin/nft -f
# Only this table is replaced, so the rules Docker manages stay untouched.
table inet material_filter
delete table inet material_filter
table inet material_filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    tcp dport { 22, 80, 8080 } accept
    udp dport { 67, 68, 5353 } accept
  }
}
