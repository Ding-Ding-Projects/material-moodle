<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Features launcher, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8B5000}a:hover{color:#5f3700}
.mm-row:focus-visible,.mm-head:focus-visible{outline:3px solid #8B5000;outline-offset:-3px}
.mm-sheet{animation:mm-up .4s cubic-bezier(.05,.7,.1,1) both}
@keyframes mm-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mm-still .mm-sheet{animation:none}
</style>
</helmet>
<div class="{{rootClass}}" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;font-family:'Roboto Flex',system-ui,sans-serif;background:{{c.bg}};color:{{c.on}}">
  <header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 8px;background:{{c.low}};border-bottom:1px solid {{c.ov}}">
    <strong style="font-size:19px;padding-left:8px;flex:1">Material</strong>
    <button type="button" aria-label="All Moodle features" aria-expanded="true" style="width:48px;height:48px;border-radius:24px;border:0;background:{{c.p}};color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"></path></svg>
    </button>
    <button type="button" aria-label="Account" style="width:48px;height:48px;border-radius:24px;border:0;background:transparent;display:flex;align-items:center;justify-content:center">
      <span style="width:36px;height:36px;border-radius:18px;background:{{c.tc}};color:{{c.ontc}};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">AU</span>
    </button>
  </header>
  <div style="position:absolute;inset:64px 0 0 0;background:rgba(20,12,6,.42)"></div>
  <div class="mm-sheet" role="dialog" aria-label="All Moodle features" style="position:absolute;left:0;right:0;bottom:0;top:120px;border-radius:28px 28px 0 0;background:{{c.high}};display:flex;flex-direction:column">
    <div aria-hidden="true" style="width:32px;height:4px;border-radius:2px;background:{{c.outline}};margin:12px auto 4px"></div>
    <div style="padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;font-size:22px;font-weight:600">Everything in Moodle</h2>
      <div style="display:flex;gap:8px">
        <label style="flex:1;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;border:1px solid {{c.outline}};border-radius:14px;background:{{c.bg}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4"></path></svg>
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Find a feature</span>
          <input type="text" value="{{q}}" onChange="{{onQ}}" placeholder="Find a feature" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:{{c.on}};outline:none">
        </label>
        <button type="button" aria-label="Use a regular expression" aria-pressed="false" style="width:52px;border:0;border-radius:14px;background:{{c.top}};color:{{c.onv}};font-family:'Roboto Mono',monospace;font-weight:700">.*</button>
      </div>
    </div>
    <div style="overflow:auto;flex:1;padding:0 8px 24px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <section>
          <button type="button" class="mm-head" aria-expanded="{{g.expanded}}" onClick="{{g.toggle}}" style="width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:0;background:transparent;color:{{c.onv}};font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer">
            <span>{{g.label}} · {{g.count}}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="transform:{{g.rotate}}"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
                <a href="#" class="mm-row" style="display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 12px;border-radius:16px;color:{{c.on}};text-decoration:none">
                  <span style="width:40px;height:40px;flex:none;border-radius:12px;background:{{it.iconBg}};color:{{it.iconFg}};display:flex;align-items:center;justify-content:center">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
                  </span>
                  <span style="display:flex;flex-direction:column;min-width:0">
                    <span style="font-size:16px;font-weight:600">{{it.label}}</span>
                    <span style="font-size:13px;color:{{c.onv}}">{{it.note}}</span>
                  </span>
                </a>
              </sc-for>
            </div>
          </sc-if>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B5000","options":["#8B5000","#3F6837","#355CA8","#8E4585"],"section":"Theme"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"motion":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '', closed: { admin: true } }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#8B5000';
    const motion = this.props.motion ?? true;
    const c = dark
      ? { bg:'#18120D', low:'#201A16', high:'#302824', top:'#3B332E', on:'#EDE0D9', onv:'#D6C3B6', ov:'#51443A', outline:'#9E8E83', sc:'#5A432C', onsc:'#FFDCBE', tc:'#414B24', ontc:'#DCE8B4', p:'#CBB08C' }
      : { bg:'#FFF8F5', low:'#FCF2EB', high:'#F0E6DF', top:'#EBE0D9', on:'#201A17', onv:'#51443A', ov:'#D6C3B6', outline:'#84746A', sc:'#F8DEC6', onsc:'#291806', tc:'#DCE8B4', ontc:'#161E01', p:accent };
    const list = [
      ['learn','Learning','My courses','Every course you are enrolled in','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5'],
      ['learn','Learning','Calendar','Deadlines and events','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
      ['learn','Learning','Find a course','Search every course','M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l4 4'],
      ['progress','Progress','Grades','Your grades in every course','M4 20V10M10 20V4M16 20v-8M22 20H2'],
      ['progress','Progress','Badges','Badges you have earned','M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z'],
      ['progress','Progress','Learning plans','Competencies assigned to you','M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z'],
      ['talk','Talk','Messages','Private and group conversations','M4 5h16v11H8l-4 4z'],
      ['talk','Talk','Blogs','Off for this site · Turn on','M4 20h4L19 9l-4-4L4 16zM14 6l4 4', true],
      ['content','Content','Private files','Files only you can see','M3 6h6l2 2h10v11H3z'],
      ['content','Content','Content bank','H5P and reusable content','M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10'],
      ['account','Account','Preferences','Language, editor and calendar','M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM12 2v3M12 19v3M2 12h3M19 12h3'],
      ['account','Account','Passkeys','Sign in without a password','M7.5 9a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM11 13L21 3M17 7l3 3'],
      ['admin','Administration','Site administration','Search every setting','M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z'],
      ['admin','Administration','Add a student','Create an account','M9 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM2 20a7 7 0 0 1 14 0M19 8v6M16 11h6']
    ];
    const s = this.state, q = s.q.toLowerCase();
    const keys = ['learn','progress','talk','content','account','admin'];
    const groups = keys.map((k) => {
      const items = list.filter((r) => r[0] === k && (!q || (r[2] + ' ' + r[3]).toLowerCase().indexOf(q) !== -1))
        .map((r) => ({ label: r[2], note: r[3], d: r[4], iconBg: r[5] ? c.top : c.sc, iconFg: r[5] ? c.onv : c.onsc }));
      const open = !!q || !s.closed[k];
      return { label: (list.find((r) => r[0] === k) || [])[1], count: items.length, items, open, expanded: open ? 'true' : 'false', rotate: open ? 'rotate(180deg)' : 'none',
        toggle: () => this.setState({ closed: { ...s.closed, [k]: !s.closed[k] } }) };
    }).filter((g) => g.count);
    return { c, rootClass: motion ? '' : 'mm-still', q: s.q, onQ: (e) => this.setState({ q: e.target.value }), groups };
  }
}
</script>
</body>
</html>
